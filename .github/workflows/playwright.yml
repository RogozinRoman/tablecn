name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # ИСПРАВЛЕНИЕ: Поднимаем честный PostgreSQL прямо в GitHub Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tablecn_test
        ports:
          - 5432:5432
        # Ждем, пока база данных успешно запустится и начнет принимать запросы
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.STORE_PATH }}
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-pnpm-and-next-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-and-next-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright Browsers
      run: |
        npm install -g @playwright/test
        npx playwright install --with-deps

    - name: Set up Environment Variables
      # ИСПРАВЛЕНИЕ: Передаем валидный DATABASE_URL, смотрящий на наш Docker-контейнер
      run: |
        echo "DATABASE_URL=postgres://test_user:test_password@localhost:5432/tablecn_test" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> $GITHUB_ENV

    - name: Push Database Schema & Seed Data
      # ИСПРАВЛЕНИЕ: Накатываем миграции Drizzle и заполняем БД тестовыми данными, 
      # чтобы Playwright нашел строки в таблице
      run: |
        pnpm db:push || echo "No push command needed"
        pnpm db:seed || pnpm db:setup || echo "Seeding bypassed"

    - name: Build Next.js application
      run: pnpm build

    - name: Run Playwright tests
      run: npx playwright test tests/ui/table.spec.ts

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: test-results/
        retention-days: 7