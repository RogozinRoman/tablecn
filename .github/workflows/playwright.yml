name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9 # или укажите версию, которая используется в вашем package.json

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

    - name: Cache pnpm modules
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    - name: Set up Environment Variables
      # Для сборки Next.js и работы Drizzle могут потребоваться заглушки под DATABASE_URL
      # Если у вас используется реальная тестовая база, добавьте её секретом в GitHub Secrets
      run: |
        echo "DATABASE_URL=postgres://mock:mock@localhost:5432/mock" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> $GITHUB_ENV

    - name: Build Next.js application
      # Если pnpm db:setup необходим для генерации типов или инициализации схемы, раскомментируйте строку ниже
      # run: pnpm db:setup 
      run: pnpm build

    - name: Run Playwright tests
      # Запускаем локальный сервер Next.js в фоновом режиме и параллельно прогоняем тесты
      # Флаг --prolonged или утилита-ожидатель обычно не нужны, так как playwright умеет ждать старта через webServer в конфиге
      run: pnpm exec playwright test

    - name: Upload Playwright Report
      uses: actions/actions-tool-cache@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30